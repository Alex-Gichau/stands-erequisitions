  </text>

  <g transform="translate(100, 395)">
    <rect x="0" y="0" width="700" height="65" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(94,234,212,0.3)" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="65" stroke="#2dd4bf" stroke-width="4" />
    <text x="24" y="28" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#e2e8f0">
