  </text>

  <g transform="translate(100, 395)">
    <rect x="0" y="0" width="700" height="65" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(167,243,208,0.3)" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="65" stroke="#34d399" stroke-width="4" />
    <text x="24" y="28" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#e2e8f0">
      &ldquo;Bring the whole tithe into the storehouse, that there may be food in my house.&rdquo;
    </text>
    <text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a7f3d0">
