<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <pattern id="churchGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#churchGrid)" />

  <!-- Decorative Orbs -->
  <circle cx="1050" cy="150" r="280" fill="#d97706" opacity="0.12" filter="blur(60px)" />
  <circle cx="150" cy="500" r="240" fill="#3b82f6" opacity="0.15" filter="blur(50px)" />

  <!-- Church Cathedral Arches Silhouette in Background -->
  <g fill="none" stroke="rgba(251,191,36,0.15)" stroke-width="2">
    <path d="M 300 630 L 300 350 Q 400 240 500 350 L 500 630" />
    <path d="M 500 630 L 500 300 Q 600 180 700 300 L 700 630" stroke-width="3" stroke="rgba(251,191,36,0.25)" />
    <path d="M 700 630 L 700 350 Q 800 240 900 350 L 900 630" />
    <!-- Cross on Central Steeple -->
    <line x1="600" y1="130" x2="600" y2="180" stroke="#fbbf24" stroke-width="4" />
    <line x1="585" y1="145" x2="615" y2="145" stroke="#fbbf24" stroke-width="4" />
  </g>

  <!-- Church Badge / Header -->
  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="380" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(251,191,36,0.4)" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#fbbf24" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="2">PCEA ST. ANDREW'S CHURCH</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="32" rx="6" fill="url(#goldGrad)" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1.5">SPECIAL HARAMBEE</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Annual Harvest &amp; Building
  </text>
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="url(#goldGrad)" letter-spacing="-0.5">
    Development Fund Drive
  </text>

  <!-- Subtitle -->
  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1" width="800">
    Partnering together in faith to expand God's sanctuary and mission ministry.
  </text>

  <!-- Scripture Box -->
  <g transform="translate(100, 395)">
    <rect x="0" y="0" width="700" height="65" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(251,191,36,0.3)" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="65" stroke="#fbbf24" stroke-width="4" />
    <text x="24" y="28" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#e2e8f0">
      &ldquo;Let us rise up and build. So they strengthened their hands for this good work.&rdquo;
    </text>
    <text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">
      — Nehemiah 2:18
    </text>
  </g>

  <!-- Badges / Info Strip at Bottom -->
  <g transform="translate(100, 500)">
    <rect x="0" y="0" width="180" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">LOCATION</text>
    <text x="20" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Main Sanctuary</text>

    <rect x="200" y="0" width="180" height="50" rx="10" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" />
    <text x="220" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#94a3b8" letter-spacing="1">SUNDAY SERVICE</text>
    <text x="220" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">09:30 AM &amp; 11:30 AM</text>

    <rect x="400" y="0" width="220" height="50" rx="10" fill="rgba(251,191,36,0.12)" stroke="rgba(251,191,36,0.3)" />
    <text x="420" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#fbbf24" letter-spacing="1">TARGET GOAL</text>
    <text x="420" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fbbf24">KES 5,000,000</text>
  </g>
</svg>
