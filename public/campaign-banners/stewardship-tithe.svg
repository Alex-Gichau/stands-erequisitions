<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="stewardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#stewardBg)" />

  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="380" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(251,191,36,0.4)" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#fbbf24" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="2">PCEA ST. ANDREW'S CHURCH</text>
  </g>

  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="220" height="32" rx="6" fill="#059669" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1.5">FINANCIAL STEWARDSHIP</text>
  </g>

  <text x="100" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Christian Stewardship &amp;
  </text>
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="#a7f3d0" letter-spacing="-0.5">
    Tithe Dedication Week
  </text>

  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#d1fae5">
