<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="easterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#easterBg)" />

  <!-- Radiating Sunburst / Resurrection Light -->
  <g opacity="0.15">
    <circle cx="850" cy="280" r="300" fill="#fde047" filter="blur(80px)" />
    <line x1="850" y1="280" x2="300" y2="50" stroke="#fde047" stroke-width="2" />
    <line x1="850" y1="280" x2="200" y2="280" stroke="#fde047" stroke-width="2" />
    <line x1="850" y1="280" x2="350" y2="520" stroke="#fde047" stroke-width="2" />
    <line x1="850" y1="280" x2="600" y2="600" stroke="#fde047" stroke-width="2" />
    <line x1="850" y1="280" x2="850" y2="0" stroke="#fde047" stroke-width="2" />
  </g>

  <!-- Golden Cross Silhouette -->
  <g transform="translate(850, 180)">
    <rect x="-8" y="0" width="16" height="190" fill="#fbbf24" rx="4" filter="drop-shadow(0 0 20px rgba(251,191,36,0.6))" />
    <rect x="-45" y="45" width="90" height="16" fill="#fbbf24" rx="4" />
  </g>

  <!-- Church Header -->
  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="380" height="38" rx="19" fill="rgba(255,255,255,0.08)" stroke="rgba(251,191,36,0.4)" stroke-width="1.5" />
    <circle cx="20" cy="19" r="6" fill="#fbbf24" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="2">PCEA ST. ANDREW'S CHURCH</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(100, 140)">
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#7c3aed" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="1.5">SPECIAL CELEBRATION</text>
  </g>

  <text x="100" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Resurrection Sunday &amp;
  </text>
  <text x="100" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" fill="#fde047" letter-spacing="-0.5">
    Festival of Praise
  </text>

  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#cbd5e1">
    Celebrate the triumph of grace and revival with the whole congregation.
  </text>

  <!-- Scripture Box -->
  <g transform="translate(100, 395)">
    <rect x="0" y="0" width="700" height="65" rx="8" fill="rgba(15,23,42,0.6)" stroke="rgba(251,191,36,0.3)" stroke-width="1" />
    <line x1="0" y1="0" x2="0" y2="65" stroke="#fde047" stroke-width="4" />
    <text x="24" y="28" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#e2e8f0">
      &ldquo;He is not here; he has risen, just as he said.&rdquo;
    </text>
    <text x="24" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fde047">
      — Matthew 28:6
    </text>
  </g>
</svg>
